<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Quale supereroe sei?</title>

    <!-- Installazione sulla schermata Home: apre senza barre del browser -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#0d0925" />
    <!-- iOS usa questa e ci applica da sé l'arrotondatura: dev'essere piena
         fino ai bordi, senza angoli arrotondati né trasparenze -->
    <link rel="apple-touch-icon" sizes="180x180" href="./icone/icona-180.png" />
    <!-- iOS: a tutto schermo, contenuto anche sotto l'orologio -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- nome sotto l'icona sulla schermata Home (iOS) -->
    <meta name="apple-mobile-web-app-title" content="Eurointerim" />

    <!-- Anteprima del link quando viene incollato in WhatsApp, LinkedIn e simili.
         Senza queste righe WhatsApp mostrava solo l'indirizzo del sito.
         og:image e og:url vogliono un indirizzo assoluto: se un domani il
         quiz cambia indirizzo, vanno aggiornati qui a mano. -->
    <meta name="description" content="Eurointerim te lo dice" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Quale supereroe sei?" />
    <meta property="og:description" content="Eurointerim te lo dice" />
    <meta property="og:site_name" content="Eurointerim" />
    <meta property="og:url" content="https://lloris-ai.github.io/quiz-supereroe/" />
    <meta property="og:image" content="https://lloris-ai.github.io/quiz-supereroe/icone/icona-512.png" />
    <meta name="twitter:card" content="summary" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
