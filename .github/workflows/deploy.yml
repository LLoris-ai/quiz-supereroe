# Pubblica il sito su GitHub Pages a ogni modifica caricata sul ramo main.
# Non serve costruire niente a mano: ci pensa GitHub a lanciare `npm run build`
# e a mettere online il contenuto di dist/.
name: Pubblica su GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # permette di rilanciare la pubblicazione a mano dal sito

permissions:
  contents: read
  pages: write
  id-token: write

# se arrivano due modifiche ravvicinate, pubblica solo l'ultima
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  costruisci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  pubblica:
    needs: costruisci
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
